<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="10" fill="#0d1a2a"/>
  <!-- Back mountain (muted blue) -->
  <polygon points="28,65 46,28 64,65" fill="#3a6080" opacity="0.75"/>
  <!-- Front mountain (gold) -->
  <polygon points="10,72 38,22 66,72" fill="#c9933a"/>
  <!-- Snow cap -->
  <polygon points="38,22 46,36 30,36" fill="#f0e6cc" opacity="0.55"/>
  <!-- Lake -->
  <path d="M6,78 Q25,71 44,78 Q63,85 82,78 L90,78 L90,95 L6,95 Z" fill="#1e4d7a" opacity="0.85"/>
  <!-- Lake shimmer -->
  <path d="M10,80 Q28,74 48,80 Q66,86 86,80" fill="none" stroke="#7ab8d8" stroke-width="1.8" opacity="0.5" stroke-linecap="round"/>
</svg>
